<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel Kuis 3D – Serang atau Bertahan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Fredoka,'Segoe UI',system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#4c1d95,#1e3a8a 50%,#0f766e);background-attachment:fixed;overflow-x:hidden}
.bg span{position:fixed;font-size:2.4rem;opacity:.18;animation:fl 12s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
.wrap{max-width:900px;margin:auto;padding:14px;position:relative}
h1.logo{font-size:clamp(2rem,8vw,3.4rem);text-align:center;margin:8px 0 0;text-shadow:0 4px 0 #0006;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.by{text-align:center;font-weight:700;color:#fde047;text-shadow:0 2px 0 #0006;margin:2px 0;animation:pu 2s infinite;font-size:1.05rem}
.sub{text-align:center;opacity:.9;margin:4px 0 14px}
.card{background:#ffffff1f;backdrop-filter:blur(8px);border:2px solid #fff3;border-radius:22px;padding:14px;margin-bottom:12px}
.btn{font:inherit;font-weight:700;font-size:1rem;color:#fff;background:#6d28d9;border:0;border-bottom:5px solid #0004;border-radius:16px;padding:11px 16px;cursor:pointer;transition:.1s}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.g{background:#16a34a}.btn.r{background:#dc2626}.btn.o{background:#f59e0b;color:#222}.btn.b{background:#2563eb}
.btn.big{font-size:1.4rem;padding:16px 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;font:inherit;font-weight:700;padding:10px;border-radius:14px;border:2px solid #fff4;background:#0003;color:#fff;cursor:pointer}
.tabs button.on{background:#f59e0b;color:#222;border-color:#fff}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:6px;background:hsl(var(--h) 70% 40%);border-radius:14px;padding:6px 8px}
.chip span{font-size:1.8rem}.chip input{flex:1;min-width:0;font:inherit;font-weight:600;background:#0003;color:#fff;border:0;border-radius:8px;padding:6px}
.chip button{background:none;border:0;color:#fff;cursor:pointer}
.gear,.ib{position:absolute;right:14px;top:10px;font-size:1.6rem;background:#0004;border:2px solid #fff4;border-radius:50%;width:46px;height:46px;cursor:pointer;color:#fff;z-index:5}
.gear:hover{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top .gear,.top .ib{position:static}
.tm{font-size:1.6rem;font-weight:700;background:#0005;border-radius:30px;padding:2px 18px}
.players{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:14px 14px 18px;scrollbar-width:thin}
.pc{position:relative;flex:1 0 108px;text-align:center;background:hsl(var(--h) 60% 35%);border:3px solid transparent;border-radius:18px;padding:6px;font-size:.9rem}
.pc .av{font-size:2.4rem}.pc.act{border-color:#fde047;box-shadow:0 0 20px #fde047;animation:pu 1s infinite;transform:scale(1.05)}
@keyframes pu{50%{box-shadow:0 0 34px #fde047}}
.pc.dead{filter:grayscale(1);opacity:.45}
.pc.hit{animation:sh .6s}.pc.block{box-shadow:0 0 30px #38bdf8}.pc.shield{box-shadow:0 0 30px #4ade80}
.pc.hit::after,.pc.block::after,.pc.shield::after{position:absolute;left:50%;top:20%;font-size:3rem;transform:translate(-50%);animation:pop 1.2s forwards}
.pc.hit::after{content:'💥'}.pc.block::after{content:'🛡️'}.pc.shield::after{content:'✨'}
@keyframes sh{20%{transform:translateX(-10px) rotate(-4deg);background:#dc2626}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-8px)}}
@keyframes pop{0%{transform:translate(-50%) scale(0)}30%{transform:translate(-50%) scale(1.6)}100%{transform:translate(-50%) scale(1);opacity:0}}
.wheelwrap{position:relative;width:min(340px,100%);margin:10px auto}
.wheelwrap canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px #0006)}
.pt{position:absolute;left:50%;top:-16px;font-size:2.4rem;line-height:1;transform:translateX(-50%);transform-origin:50% 20%;transition:transform .06s;z-index:2;filter:drop-shadow(0 2px 2px #0008)}
.pc.tgt{border-color:#f87171;box-shadow:0 0 22px #f87171;filter:brightness(1.3)}
.hub{position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ef4444,#991b1b);color:#fff;font:700 clamp(.95rem,4vw,1.3rem) Fredoka,sans-serif;cursor:pointer;z-index:3;padding:0;box-shadow:0 4px 12px #0008;animation:hubp 1s ease-in-out infinite}
.hub:active{transform:translate(-50%,-50%) scale(.92)}
.hub:disabled{animation:none;background:#312e81;cursor:default;font-size:1.6rem}
@keyframes hubp{50%{box-shadow:0 0 0 10px #fde04799,0 4px 12px #0008}}
.acts.k3{grid-template-columns:1fr 1fr 1fr}.acts.k3 .btn{font-size:1.05rem;padding:22px 2px}
@media(min-width:561px){.acts.k3 .btn{font-size:1.4rem}}
.gm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.gm button{font:inherit;font-weight:700;padding:10px 6px;border-radius:14px;border:2px solid #fff4;background:#0003;color:#fff;cursor:pointer}
.gm button.on{background:#f59e0b;color:#222;border-color:#fff}
.stage{text-align:center}
.q{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:700;margin:6px 0 12px}
.q-img{max-width:100%;max-height:240px;border-radius:16px;border:3px solid #fff;margin-bottom:10px}
.bar{height:12px;background:#0005;border-radius:8px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transition:width 1s linear}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-weight:700;font-size:1.15rem;text-align:left;color:#fff;border:0;border-bottom:6px solid #0004;border-radius:16px;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt b{background:#0004;border-radius:10px;padding:2px 10px}
.opt:active{transform:translateY(3px)}.opt.ok{outline:5px solid #fff;animation:pu .5s 3}.opt.no{opacity:.35}
.msg{font-size:1.7rem;font-weight:700;animation:bounce .6s}@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.acts .btn{font-size:1.5rem;padding:26px 8px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
.tg .btn{display:block;background:hsl(var(--h) 70% 42%)}.tg .btn span{font-size:2.4rem;display:block}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.md{background:#312e81;border:3px solid #fff5;border-radius:24px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;animation:bounce .35s}
.md h2{margin:0 0 10px}.md .btn{width:100%;margin-top:8px}
.md input[type=text],.md textarea,.md select{width:100%;font:inherit;background:#0004;color:#fff;border:2px solid #fff3;border-radius:10px;padding:8px;margin:3px 0}
.md textarea{min-height:130px;font-size:.85rem}
.stp{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px}
.stp div{display:flex;align-items:center;gap:10px}.stp button{width:38px;height:38px;border-radius:50%;border:0;font-size:1.3rem;font-weight:700;background:#f59e0b;cursor:pointer}.stp b{min-width:36px;text-align:center;font-size:1.3rem}
.ql{display:flex;gap:10px;align-items:center;background:#ffffff1a;border-radius:14px;padding:8px;margin:6px 0;font-size:.95rem}
.ql img{width:56px;height:56px;object-fit:cover;border-radius:10px}.ql .t{flex:1}.ql small{opacity:.8}
.ql button{background:#0004;border:0;border-radius:10px;font-size:1.2rem;padding:8px;cursor:pointer}
.opr{display:flex;gap:6px;align-items:center}.opr input[type=radio]{width:22px;height:22px}
.rk{display:flex;align-items:center;gap:10px;background:#ffffff22;border-radius:16px;padding:10px;margin:8px 0;font-size:1.2rem;font-weight:700}.rk.w{background:linear-gradient(90deg,#f59e0b,#fde047);color:#222;animation:pu 1s infinite;font-size:1.5rem}
.rk .av{font-size:2.2rem}.rk em{margin-left:auto;font-style:normal}
.cf{position:fixed;top:-50px;font-size:2rem;animation:fa 4s linear infinite;z-index:60;pointer-events:none}@keyframes fa{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;border-radius:30px;padding:10px 20px;z-index:99;font-weight:600}

/* ---- 3D ---- */
#a3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1}
body.g3 .bg{display:none}
h1.logo{text-shadow:0 1px 0 #0007,0 2px 0 #0007,0 3px 0 #0007,0 4px 0 #0007,0 5px 0 #0007,0 10px 14px #0009}
.wheelwrap{transform:perspective(800px) rotateX(14deg)}
body.g3 .wrap.gv{min-height:100vh;display:flex;flex-direction:column}
body.g3 .gv .players{padding:8px 6px 10px}
body.g3 .gv .pc{flex:1 0 84px;padding:3px;font-size:.78rem;background:hsl(var(--h) 60% 30% / .7)}
body.g3 .gv .pc .av{font-size:1.5rem}
body.g3 .gv .stage{margin-top:auto;max-height:46vh;overflow:auto;padding:10px;margin-bottom:6px;background:#1e1b4bcc}
body.g3 .gv .pc{display:flex;flex-direction:column;align-items:center;flex:1 1 70px;min-width:0}
body.g3 .gv .pc>div:nth-child(3),body.g3 .gv .pc>div:nth-child(4){display:none}
body.g3 .gv .pc b{font-size:.78rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.g3 .gv .top{margin-bottom:0}
body.g3 .gv .q{font-size:clamp(1.05rem,2.6vw,1.5rem);margin:2px 0 8px}
body.g3 .gv .opt{font-size:1rem;padding:9px}
body.g3 .gv .stage img{max-height:20vh;width:auto}
body.g3 .ev{min-height:100vh;display:flex;flex-direction:column}
body.g3 .ev .logo{margin:6px 0}
body.g3 .ev .rk.w{margin-top:auto}
/* deretan potret pahlawan di bawah, seperti game RPG */
body.g3 .gv .top{order:1}body.g3 .gv .stage{order:2}
body.g3 .gv .players{order:3;justify-content:center;gap:8px;padding:4px 8px 10px}
body.g3 .gv .pc{flex:0 0 auto;width:86px;min-width:86px;padding:5px 2px 3px;border:3px solid #fbbf24;border-radius:12px;background:linear-gradient(160deg,hsl(var(--h) 65% 46%),hsl(var(--h) 65% 20%));box-shadow:0 4px 10px #000a,inset 0 0 0 2px #0006;font-size:.7rem}
body.g3 .gv .pc>div:nth-child(3){display:block;font-size:.62rem;line-height:1}
body.g3 .gv .pc .av{font-size:2.1rem;line-height:1.1}
body.g3 .gv .pc.act{border-color:#fff7a8;transform:translateY(-6px) scale(1.06)}
/* dialog tanpa kotak: hanya tulisan */
body.g3 .gv .stage{background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;max-height:none!important;overflow:visible!important;padding:2px 10px!important;text-shadow:0 2px 5px #000,0 0 14px #000,0 0 3px #000;touch-action:none}
body.g3 .gv .stage div[style*="font-size:4.5rem"]{display:none}
body.g3 .wrap.gv{touch-action:none}
body.g3 .gv .pc.dead::before{content:'dead';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:#fff;text-shadow:0 2px 4px #000;z-index:2}
.ctl{overflow:auto}.ctl .bg{display:none}
.cwrap{max-width:560px;margin:auto;min-height:100vh;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:1.15rem}
.cw{margin:auto;text-align:center;width:100%}.cw .rk{text-align:left}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#0009;border-radius:14px;padding:8px 12px;font-weight:700;flex-wrap:wrap}
.cq{flex:1;display:flex;flex-direction:column;gap:8px;text-align:center}
.co{display:grid;grid-template-columns:1fr;gap:10px;margin-top:auto}
.qb{height:10px;background:#0006;border-radius:6px;overflow:hidden}.qb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444)}
.qh{display:flex;justify-content:space-between;font-weight:700;margin:3px 2px}.qh .fb{color:#fde047}
.qq{font-weight:700;font-size:1.5rem;margin:2px 0 8px}.qi{max-height:28vh;max-width:100%;border-radius:12px;border:2px solid #fff;margin:0 auto 4px}
.qopt{font:inherit;font-weight:700;font-size:1.25rem;text-align:left;color:#fff;border:0;border-bottom:5px solid #0005;border-radius:16px;padding:18px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.qopt b{background:#0005;border-radius:8px;padding:0 9px}.qopt:active{transform:translateY(3px)}.qopt.ok,.qopt.sel{outline:4px solid #fff}.qopt.no{outline:4px solid #000}.qopt.dim{opacity:.35}
.cpl{display:flex;flex-direction:column;gap:4px;margin-top:6px}.cpl div{display:flex;justify-content:space-between;background:#0006;border-radius:10px;padding:5px 10px;font-size:1rem;text-align:left}.cpl .me{outline:2px solid #fde047}
.cw .btn,.co .btn{width:100%}
body.sp #cwg,body.sp #thw{display:none!important}
body.ctl:not(.c3) #a3d{display:none}
body.c3{overflow:hidden;touch-action:none}
body.ctl #cwg,body.ctl #thw{display:none!important}
.cwrap.c3w{height:100dvh;min-height:0;padding:6px;gap:6px}
.cstage{margin-top:auto;background:#1e1b4bee;border:3px solid #fff3;border-radius:20px;padding:10px;max-height:58vh;overflow:auto;touch-action:pan-y;text-align:center}
.cstage .cw,.cstage .cq{margin:0}.cstage .co{grid-template-columns:1fr 1fr;gap:8px}.cstage .co.co1{grid-template-columns:1fr}
.cstage .qopt{font-size:1.05rem;padding:12px 10px}.cstage .qq{font-size:1.2rem;margin:0 0 4px}.cstage .qi{max-height:16vh}
.cstage .msg{font-size:1.2rem}.cstage h2,.cstage h3{margin:4px 0}.cstage p{margin:4px 0}
.c3w .ch{background:#1e1b4bcc;backdrop-filter:blur(4px)}
</style></head><body>
<div class="bg"><span style="left:5%;animation-delay:0s">⚔️</span><span style="left:25%;animation-delay:3s">🛡️</span><span style="left:45%;animation-delay:6s">⭐</span><span style="left:65%;animation-delay:2s">🧠</span><span style="left:85%;animation-delay:8s">🚀</span></div>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EM=['🦁','🐯','🐼','🦊','🐸','🐵','🦄','🐲','🐙','🦖','🐧','🐰'],COL=['#ef4444','#3b82f6','#f59e0b','#16a34a'],L='ABCD';
const SAMPLE=[['Ibu kota Indonesia adalah…','Jakarta','Bandung','Surabaya','Medan',0],['5 × 6 = …','25','30','35','36',1],['Planet terdekat dari Matahari?','Venus','Bumi','Merkurius','Mars',2],['Hewan yang bertelur dan menyusui?','Platypus','Kucing','Paus','Kelelawar',0],['Air membeku pada suhu … °C','100','50','0','-10',2],['Pulau terbesar di Indonesia?','Jawa','Kalimantan','Sumatra','Papua',1]].map(a=>({q:a[0],o:a.slice(1,5),a:a[5],img:''}));
let S;try{S=JSON.parse(localStorage.getItem('duelkuis'))}catch(e){}
S=S||{mode:'ind',ps:[{n:'Pemain 1'},{n:'Pemain 2'}],qs:SAMPLE,cfg:{t:20,l:3,p:10}};
let view='splash',modal=null,G=null,E=null,IM={};
const JOIN=(new URLSearchParams(location.search).get('join')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const save=()=>{try{localStorage.setItem('duelkuis',JSON.stringify(S))}catch(e){toast('Penyimpanan penuh, kurangi gambar')}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
let AC;function beep(f,d=.15,t='sine',v=.12){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v*(S.vol??1);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
/* ---- SUARA: file mp3 pilihan guru (disimpan di IndexedDB); kosong = suara bawaan ---- */
const CS={},SL={bgm:'🎵 bgm.mp3',tick:'⏱️ tick.mp3',attack:'💥 attack.mp3',bertahan:'🛡️ bertahan.mp3',eliminasi:'💀 eliminasi.mp3',damage:'💔 damage.mp3 (terkena damage)',salah:'❌ salah.mp3',benar:'✅ benar.mp3',menang:'🏆 menang.mp3'};let bgA=null,bgIv=null;
function play(n,fb,loop){try{const a=new Audio(CS[n]||n+'.mp3');a.loop=!!loop;a.volume=(loop?.4:1)*(S.vol??1);const p=a.play();if(p)p.catch(()=>{loop?defBgm():fb&&fb()});return a}catch(e){fb&&fb()}}
function defBgm(){if(bgIv)return;let i=0;const N=[523,659,784,659,587,698,880,698];bgIv=setInterval(()=>{if(S.bgm!==false&&!(G&&G.paused))beep(N[i++%8],.22,'triangle',.04)},340)}
function bgmStart(){bgStop();if(S.bgm!==false)bgA=play('bgm',null,true)}
function setVol(v){S.vol=v/100;save();if(bgA)bgA.volume=.4*S.vol;$('vl').textContent=v+'%';beep(660,.08)}
const TPL='Pertanyaan|Pilihan A|Pilihan B|Pilihan C|Pilihan D|Jawaban (A/B/C/D)|Nama file gambar (opsional)\nIbu kota Indonesia adalah…|Jakarta|Bandung|Surabaya|Medan|A\n2 + 3 = …|4|5|6|7|B\nHewan apakah ini?|Kucing|Anjing|Burung|Ikan|A|kucing.jpg\n|Apel|Jeruk|Mangga|Anggur|C|soal-buah.jpg';
function tpl(){$('it').value=TPL;toast('Template dimuat, silakan ganti isinya')}
function copyT(){const t=$('it');if(!t.value)t.value=TPL;t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}toast('📋 Tersalin, tempel ke Excel/Notepad')}
function bgStop(){if(bgA){bgA.pause();bgA=null}clearInterval(bgIv);bgIv=null}
function toggleTg(){S.tgm=S.tgm=='pick'?'spin':'pick';save();R()}
function toggleTk(){S.tk=S.tk===false;if(S.tk===false)stopTick();save();R()}
function toggleBgm(){S.bgm=S.bgm===false;save();if(S.bgm===false)bgStop();else if(!G||G.ph!='end')bgmStart();R()}
/* ---- TICK: tick.mp3 (satu folder dengan file ini) atau pilihan guru; kosong/tidak ada = bunyi detik bawaan ---- */
let TKA=null,TKbad=false,TKL=null;
function stopTick(){if(TKL){try{TKL.pause();TKL.currentTime=0}catch(e){}TKL=null}}
function tickSnd(hi){if(!G||view!='game'||G.ph!='q'||G.paused||modal||S.tk===false)return;stopTick();const fb=()=>{if(G&&view=='game'&&G.ph=='q'&&!G.paused&&!modal&&S.tk!==false)beep(hi?1250:950,.04,'square',.06)};try{if(!TKbad){if(!TKA){TKA=new Audio(CS.tick||'tick.mp3');TKA.preload='auto';TKA.addEventListener('error',()=>{TKbad=true})}const a=TKA.cloneNode();a.volume=Math.min(1,S.vol??1);TKL=a;const pr=a.play();if(pr)pr.catch(fb);return}}catch(e){}fb()}
const DB=()=>new Promise((r,j)=>{const q=indexedDB.open('dk',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=j});
async function dbSet(k,v){try{(await DB()).transaction('s','readwrite').objectStore('s').put(v,k)}catch(e){}}
